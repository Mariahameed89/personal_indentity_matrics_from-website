# Netlify configuration for the PipelineFlow static demo.
# No build step — the site is plain HTML/CSS/JS served from the repo root.

[build]
  publish = "."
  command = ""

# Send visitors to the privacy page via a clean path (optional convenience).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Reasonable baseline security headers for a static marketing site.
# NOTE: we intentionally do NOT set a restrictive Content-Security-Policy here,
# because the Leadpipe pixel loads from https://leadpipe.aws53.cloud and may set
# cookies / make requests. Add a CSP only if you know every host it needs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
